[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-job-fit-scorer"
version = "0.1.0"
description = "Local-first CLI that scores how well a resume matches a job description."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfredo Cardona" }]
keywords = ["resume", "ollama", "cli", "hiring", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
fit-score = "fit_score.cli:app"

[project.urls]
Homepage = "https://github.com/SilverBomb-Gaming/resume-job-fit-scorer"
Repository = "https://github.com/SilverBomb-Gaming/resume-job-fit-scorer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
